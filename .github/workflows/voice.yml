name: Ovoz yaratish (Edge TTS, o'zbekcha)

on:
  workflow_dispatch:
  push:
    paths:
      - "voices/**/script.txt"
      - "voices/**/voice.json"
      - "tools/voice/**"
      - ".github/workflows/voice.yml"

permissions:
  contents: write

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-small-${{ runner.os }}-v1
      - name: Test fixed voice selection
        run: python -m unittest discover -s tools/voice -p 'test_make_voice.py' -v
      - name: Test Whisper voice QA
        run: python -m unittest discover -s tools/voice -p 'test_check_voice.py' -v
      - run: pip install edge-tts==7.3.1 faster-whisper==1.1.1 requests==2.34.2
      - run: python tools/voice/make_voice.py voices
      - name: Compare generated voice with script
        continue-on-error: true
        run: python tools/voice/check_voice.py voices --model small --language uz --compute-type int8
      - name: Commit voices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voices
          git diff --cached --quiet && exit 0
          git commit -m "voice: generated audio and word timings"
          git pull --rebase
          git push
